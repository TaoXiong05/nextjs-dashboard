name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 并发控制：当连续 Push 代码时，自动取消上一次还没跑完的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: CI 自动化校验
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.7.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Build Next.js
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm build

  # ==========================================
  # Job 2: CD Docker 镜像构建与自动推送（包含 PR 环境验证）
  # ==========================================
  deploy-docker:
    needs: build-and-test
    # 💡 移除了原本的 if 限制，使得 PR 分支通过 CI 后也能跑 CD 进行打包验证
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # 开启写入 GitHub 镜像仓库 (GHCR) 的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 自动登录 GitHub 官方提供的 Docker 镜像仓库 (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 自动注入，无需额外设置 Secret

      # 💡 智能生成镜像标签：区分生产环境和 PR 测试环境
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # 1. 只有推送到 main/master 时，才打上 :latest 标签（生产镜像）
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # 2. 如果是 PR 事件，打上 :pr-12 这种专属测试标签（用于在测试环境验证 CD）
            type=ref,event=pr
            # 3. 任何提交都带上提交哈希前缀，如 :sha-a1b2c3d
            type=sha,format=short

      # 打包镜像并推送至 GitHub 云端仓库
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            POSTGRES_URL=${{ secrets.POSTGRES_URL }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}




            # ==========================================
  # Job 3: 源码部署到 Azure App Service (免费层)
  # ==========================================
  deploy-branch-to-azure:
    needs: build-and-test
    # 允许在当前分支推送时触发部署
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm build

      # 将打包好的当前分支代码推送到 Azure
      - name: Deploy Branch Code to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nextjs-dashboard'  # 改为你的 Azure App Service 名称
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .