name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, 'TaoXiong05-patch-1', 'feature/*' ] # 👈 添加你的分支，让分支 Push 时能触发 Preview
  pull_request:
    branches: [ main, master ] # 当发起合并到 main 的 PR 时触发校验

# 并发控制：当连续 Push 代码时，自动取消上一次还没跑完的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Job 1: CI 自动化校验
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25.7.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linter
        run: pnpm lint

      - name: Build Next.js
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm build

        # 🌟 1. 复制静态文件到 standalone 文件夹（Next.js standalone 模式必须步骤）
      - name: Copy static files to standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

     

  # ==========================================
  # Job 2: CD Docker 镜像构建与自动推送（包含 PR 环境验证）
  # ==========================================
  deploy-docker:
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # 开启写入 GitHub 镜像仓库 (GHCR) 的权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 自动登录 GitHub 官方提供的 Docker 镜像仓库 (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 智能生成镜像标签：区分生产环境和分支/PR 测试环境
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      # 打包镜像并推送至 GitHub 云端仓库
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            POSTGRES_URL=${{ secrets.POSTGRES_URL }}
            AUTH_SECRET=${{ secrets.AUTH_SECRET }}

  # ==========================================
  # Job 3a: 部署【Preview 预览/测试环境】(当非 main 分支提交时触发)
  # ==========================================
  deploy-preview:
    needs: build-and-test
    # 当有 push 事件且分支不是 main 或 master 时触发部署
    if: github.event_name == 'push' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest

    # 🌟 关键：自动使用 GitHub 设置中 "Preview" 环境里的 Secrets
    environment: Preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }} # 自动拉取 Preview 环境下的数据库链接
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm build

        # 🌟 1. 拷贝静态资源到 standalone 目录
      - name: Prepare standalone package
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      # 🌟 2. 压缩 standalone，注意 zip 命令添加 -y 标志（保持符号链接）
      - name: Zip standalone package
        run: |
          cd .next/standalone
          zip -r -y ../../deploy.zip .
          cd ../..

      - name: Deploy to Preview Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }} # 在 Preview 环境的 Secrets 中填测试 Azure App 名字
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # 自动拉取 Preview 环境下的发布凭据
          package: .next/standalone

  # ==========================================
  # Job 3b: 部署【Production 生产环境】(当合并到 main/master 时触发)
  # ==========================================
  deploy-production:
    needs: build-and-test
    # 当推送到 main 或 master 分支时触发
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    # 🌟 关键：自动使用 GitHub 设置中 "Production" 环境里的 Secrets
    environment: Production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        env:
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }} # 自动拉取 Production 环境下的数据库链接
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: pnpm build

        # 🌟 1. 拷贝静态资源到 standalone 目录
      - name: Prepare standalone package
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

      # 🌟 2. 压缩 standalone，注意 zip 命令添加 -y 标志（保持符号链接）
      - name: Zip standalone package
        run: |
          cd .next/standalone
          zip -r -y ../../deploy.zip .
          cd ../..

      - name: Deploy to Production Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }} # 在 Production 环境的 Secrets 中填生产 Azure App 名字
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} # 自动拉取 Production 环境下的发布凭据
          package: .next/standalone