name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    # 🐘 定义 Postgres 服务容器
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: next_dashboard
        ports:
          - 5432:5432
        # 确保 Postgres 容器就绪后再开始跑 steps
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: "pnpm"

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      # 🌱 可选：如果你有播种脚本（如 seed 脚本初始化数据库表和测试数据）
      # - name: Seed database
      #   env:
      #     POSTGRES_URL: "postgres://postgres:postgrespassword@localhost:5432/next_dashboard"
      #   run: pnpm seed  # 对应 package.json 中如果定义了 seed 命令的话

      - name: Build
        env:
          # 传递真实连向本地 5432 端口 Postgres 的连接串
          POSTGRES_URL: "postgres://postgres:postgrespassword@localhost:5432/next_dashboard"
          AUTH_SECRET: "ci-build-secret-key-placeholder"
        run: pnpm build