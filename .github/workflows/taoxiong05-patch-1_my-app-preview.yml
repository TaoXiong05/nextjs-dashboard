# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - my-app-preview

on:
  push:
    branches:
      - TaoXiong05-patch-1
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B3DC8486779E49FB92B6764D503CE32A }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_B7B4F371F7504180A465FD32366CD42C }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ghcr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B3DC8486779E49FB92B6764D503CE32A }}/taoxiong05/nextjs-dashboard:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B0E7F63DCA3A483587A663EC4E6B73E8 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2FCDABD486AE495F9F922DA720A41740 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_76D4FAAB4BB24261BDB637C1B0BBDFA8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'my-app-preview'
          slot-name: 'Production'
          images: 'ghcr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_B3DC8486779E49FB92B6764D503CE32A }}/taoxiong05/nextjs-dashboard:${{ github.sha }}'
          